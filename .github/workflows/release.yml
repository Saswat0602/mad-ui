name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck root library
        run: npm run typecheck

      - name: Build root library
        run: npm run build

      - name: Run unit and smoke tests
        run: npm test

      - name: Check package exports and fields (publint)
        run: npm run check:pkg

      - name: Check component manifest integrity
        run: npm run check:manifest

      - name: Check npm token configuration
        id: check-token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "⚠️ NPM_TOKEN secret is not set in repository secrets. Skipping publish step."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check-token.outputs.has_token == 'true'
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view mad-ui-components version 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $CURRENT_VERSION is already published to npm. Skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
